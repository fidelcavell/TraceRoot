spring.application.name=TraceRoot
server.port=9091

# Elasticsearch config:
spring.elasticsearch.uris=http://localhost:9200

# Ollama's AI model config (CLOUD):
spring.ai.ollama.base-url=https://ollama.com/api/chat
spring.ai.ollama.chat.options.model=gpt-oss:120b
ollama.api.key=${OLLAMA_API_KEY}

# H2 database, file-based datasource:
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate DDL generation:
spring.jpa.hibernate.ddl-auto=update

# Prometheus config:
prometheus.query.base.url=http://localhost:9090/api/v1
